name: Check HTTP Contracts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: depot-ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generate HTTP contracts
        run: go generate ./internal/server/contracts

      - name: Check generated contracts
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- api/openapi.yaml internal/server/contracts)" ]; then
            git status --short --untracked-files=all -- api/openapi.yaml internal/server/contracts
            git diff -- api/openapi.yaml internal/server/contracts
            exit 1
          fi

      - name: Test tool management contracts
        run: go test ./internal/server ./internal/server/controllers -run '^Test(ToolManagement|ServerHostBinding)'
